@if (visible) {
  <div class="overlay" (click)="onClose()"></div>
  <div class="modal">
    <div class="modal-header">
      <h3>{{ task ? 'Editar tarea' : 'Nueva tarea' }}</h3>
      <button class="btn-close" (click)="onClose()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Título *</label>
        <input
          type="text"
          [(ngModel)]="title"
          placeholder="¿Qué necesitas hacer?"
          (keyup.enter)="onSave()"
        />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea
          [(ngModel)]="description"
          placeholder="Agrega detalles (opcional)"
          rows="3"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Fecha de vencimiento</label>
          <input type="date" [(ngModel)]="due_date" />
        </div>

        <div class="form-group">
          <label>Prioridad</label>
          <select [(ngModel)]="priority">
            <option value="baja">🟢 Baja</option>
            <option value="media">🟡 Media</option>
            <option value="alta">🔴 Alta</option>
          </select>
        </div>
      </div>

      @if (task) {
        <div class="form-group">
          <label>Estado</label>
          <select [(ngModel)]="status">
            <option value="pendiente">Pendiente</option>
            <option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option>
          </select>
        </div>
      }
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()">Cancelar</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="!title.trim()">
        {{ task ? 'Guardar cambios' : 'Crear tarea' }}
      </button>
    </div>
  </div>
}
